<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打卡助手">
<title>打卡助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--text2:#8e8e93;--border:#e5e5ea}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom,20px)}
.header{background:var(--card);padding:16px 20px;text-align:center;font-size:18px;font-weight:700;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.header small{display:block;font-size:13px;color:var(--text2);font-weight:400;margin-top:2px}
.container{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text2)}
.clock-btns{display:flex;gap:12px;margin-bottom:16px}
.clock-btn{flex:1;padding:18px 12px;border:none;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;color:#fff;transition:all .15s;-webkit-tap-highlight-color:transparent}
.clock-btn:active{transform:scale(.96);opacity:.85}
.clock-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-in{background:var(--green)}
.btn-out{background:var(--orange)}
.time-display{text-align:center;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:12px}
.time-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:15px}
.time-row .label{color:var(--text2)}
.time-row .value{font-weight:600;font-family:"SF Mono",monospace}
.overtime-badge{display:inline-block;background:var(--red);color:#fff;padding:6px 16px;border-radius:20px;font-size:16px;font-weight:700;margin-top:8px}
.overtime-badge.zero{background:var(--green)}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row label{font-size:15px;color:var(--text2)}
.settings-row input{width:90px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;text-align:center;background:var(--bg)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat-item{padding:12px 4px;background:var(--bg);border-radius:10px}
.stat-num{font-size:22px;font-weight:800;color:var(--blue)}
.stat-num.warn{color:var(--red)}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px}
.stat-avg{font-size:11px;color:var(--text2);margin-top:2px}
.record-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.record-item:last-child{border-bottom:none}
.record-date{font-weight:600;font-size:15px}
.record-time{font-size:13px;color:var(--text2);margin-top:2px;font-family:"SF Mono",monospace}
.record-time .ot{color:var(--red);font-weight:600}
.record-time .late{color:var(--orange);font-weight:600}
.record-right{display:flex;align-items:center;gap:6px}
.action-btn{background:none;border:none;font-size:14px;cursor:pointer;padding:4px 8px;-webkit-tap-highlight-color:transparent}
.action-btn.edit{color:var(--blue)}
.action-btn.del{color:var(--red)}
.empty{text-align:center;padding:30px;color:var(--text2);font-size:14px}
.toggle-settings{width:100%;padding:12px;background:none;border:1px solid var(--border);border-radius:10px;font-size:15px;color:var(--blue);cursor:pointer;margin-bottom:12px}
.settings-panel{display:none}
.settings-panel.show{display:block}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:90%;max-width:360px}
.modal h3{font-size:17px;margin-bottom:16px;text-align:center}
.modal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-row label{font-size:15px;color:var(--text2)}
.modal-row input{width:130px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px;text-align:center;background:var(--bg)}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.modal-btns .cancel{background:var(--bg);color:var(--text)}
.modal-btns .confirm{background:var(--blue);color:#fff}
</style>
</head>
<body>
<div class="header">打卡助手<small id="todayDate"></small></div>
<div class="container">
  <div class="card">
    <div class="clock-btns">
      <button class="clock-btn btn-in" id="btnIn">上班打卡</button>
      <button class="clock-btn btn-out" id="btnOut" disabled>下班打卡</button>
    </div>
    <div id="todayStatus"></div>
  </div>

  <button class="toggle-settings" id="toggleSettings">⚙️ 工时设置</button>
  <div class="card settings-panel" id="settingsPanel">
    <div class="card-title">每日工时配置</div>
    <div class="settings-row">
      <label>上班时间</label>
      <input type="time" id="setWorkStart" value="09:00">
    </div>
    <div class="settings-row">
      <label>下班时间</label>
      <input type="time" id="setWorkEnd" value="18:00">
    </div>
    <div class="settings-row">
      <label>上班弹性(分钟)</label>
      <input type="number" id="setFlex" value="30" min="0" max="120">
    </div>
    <div class="settings-row">
      <label>加班缓冲(分钟)</label>
      <input type="number" id="setBuffer" value="30" min="0" max="120">
    </div>
    <div style="text-align:center;margin-top:14px">
      <button id="saveSettingsBtn" style="padding:10px 32px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer">保存设置</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">本月统计</div>
    <div class="stats-grid">
      <div class="stat-item"><div class="stat-num" id="statDays">0</div><div class="stat-label">出勤天数</div><div class="stat-avg" id="statAvgMonth">—</div></div>
      <div class="stat-item"><div class="stat-num" id="statOT">0h</div><div class="stat-label">加班时长</div><div class="stat-avg" id="statAvgMonthOt">—</div></div>
      <div class="stat-item"><div class="stat-num warn" id="statLate">0</div><div class="stat-label">迟到次数</div><div class="stat-avg" id="statAvgMonthLate">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">本周统计</div>
    <div class="stats-grid">
      <div class="stat-item"><div class="stat-num" id="statWeekDays">0</div><div class="stat-label">出勤天数</div><div class="stat-avg" id="statAvgWeek">—</div></div>
      <div class="stat-item"><div class="stat-num" id="statWeekOT">0h</div><div class="stat-label">加班时长</div><div class="stat-avg" id="statAvgWeekOt">—</div></div>
      <div class="stat-item"><div class="stat-num warn" id="statWeekLate">0</div><div class="stat-label">迟到次数</div><div class="stat-avg" id="statAvgWeekLate">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">近三个月统计</div>
    <div class="stats-grid">
      <div class="stat-item"><div class="stat-num" id="stat3mDays">0</div><div class="stat-label">出勤天数</div><div class="stat-avg" id="statAvg3m">—</div></div>
      <div class="stat-item"><div class="stat-num" id="stat3mOT">0h</div><div class="stat-label">加班时长</div><div class="stat-avg" id="statAvg3mOt">—</div></div>
      <div class="stat-item"><div class="stat-num warn" id="stat3mLate">0</div><div class="stat-label">迟到次数</div><div class="stat-avg" id="statAvg3mLate">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">历史记录</div>
    <div id="recordList"></div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3 id="editModalTitle">修改打卡时间</h3>
    <div class="modal-row">
      <label>上班打卡</label>
      <input type="time" id="editClockIn">
    </div>
    <div class="modal-row">
      <label>下班打卡</label>
      <input type="time" id="editClockOut">
    </div>
    <div class="modal-btns">
      <button class="cancel" id="editCancel">取消</button>
      <button class="confirm" id="editConfirm">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'clock_records_v5';
  const SETTINGS_KEY = 'clock_settings_v5';
  let editingDate = null;

  function getSettings(){
    const def = {workStart:'09:00', workEnd:'18:00', flexMin:30, buffer:30};
    try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY));return s?{...def,...s}:def;}catch(e){return def;}
  }
  function getRecords(){
    try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return[];const arr=JSON.parse(raw);if(!Array.isArray(arr))return[];return arr.map(r=>({date:r.date||'',clockIn:r.clockIn||null,clockOut:r.clockOut||null})).filter(r=>r.date);}catch(e){return [];}
  }
  function saveRecords(r){localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}
  function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
  function timeToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
  function minToH(m){if(m<=0)return'0h';const h=Math.floor(m/60),mm=m%60;return mm>0?h+'h'+mm+'m':h+'h';}
  function avgLabel(totalMin,days){if(days<=0)return'—';return'平均 '+minToH(Math.round(totalMin/days))+'/天';}

  // 只算下班时间之后的部分，减去缓冲
  function calcOvertime(clockOut, settings){
    const outMin=timeToMin(clockOut), endMin=timeToMin(settings.workEnd), buf=settings.buffer||0;
    return Math.max(0, Math.round(outMin-endMin-buf));
  }
  // 超过「上班时间+弹性」算迟到
  function isLate(clockIn, settings){
    return timeToMin(clockIn) > timeToMin(settings.workStart)+(settings.flexMin||0);
  }
  function calcStats(list, settings){
    let days=0,totalOT=0,late=0;
    list.forEach(r=>{if(!r.clockIn||!r.clockOut)return;days++;totalOT+=calcOvertime(r.clockOut,settings);if(isLate(r.clockIn,settings))late++;});
    return {days,totalOT,late};
  }

  function clockIn(){
    const t=todayStr();let records=getRecords();const ex=records.find(r=>r.date===t);
    if(ex&&ex.clockIn){alert('今天已经打过上班卡了');return;}
    if(ex)ex.clockIn=nowTime();else records.unshift({date:t,clockIn:nowTime(),clockOut:null});
    saveRecords(records);render();
  }
  function clockOut(){
    const t=todayStr();let records=getRecords();const ex=records.find(r=>r.date===t);
    if(!ex||!ex.clockIn){alert('请先打上班卡');return;}
    if(ex.clockOut){alert('今天已经打过下班卡了');return;}
    ex.clockOut=nowTime();saveRecords(records);render();
  }
  function deleteRecord(date){if(!confirm('确定删除 '+date+' 的记录？'))return;saveRecords(getRecords().filter(r=>r.date!==date));render();}
  function openEditModal(date){
    editingDate=date;const rec=getRecords().find(r=>r.date===date);if(!rec)return;
    document.getElementById('editModalTitle').textContent='修改 '+date+' 打卡时间';
    document.getElementById('editClockIn').value=rec.clockIn||'';
    document.getElementById('editClockOut').value=rec.clockOut||'';
    document.getElementById('editModal').classList.add('show');
  }
  function closeEditModal(){document.getElementById('editModal').classList.remove('show');editingDate=null;}
  function saveEditTime(){
    const ci=document.getElementById('editClockIn').value.trim(),co=document.getElementById('editClockOut').value.trim()||null;
    if(!ci){alert('上班时间不能为空');return;}
    if(co&&timeToMin(co)===timeToMin(ci)){alert('下班时间不能等于上班时间');return;}
    const rec=getRecords().find(r=>r.date===editingDate);if(!rec)return;
    rec.clockIn=ci;rec.clockOut=co;saveRecords(getRecords());closeEditModal();render();
  }

  function render(){
    const settings=getSettings(), records=getRecords(), t=todayStr();
    const todayRec=records.find(r=>r.date===t);
    const d=new Date(), wd=['日','一','二','三','四','五','六'];
    document.getElementById('todayDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wd[d.getDay()];
    document.getElementById('setWorkStart').value=settings.workStart;
    document.getElementById('setWorkEnd').value=settings.workEnd;
    document.getElementById('setFlex').value=settings.flexMin;
    document.getElementById('setBuffer').value=settings.buffer;

    const btnIn=document.getElementById('btnIn'), btnOut=document.getElementById('btnOut');
    if(todayRec&&todayRec.clockIn){btnIn.disabled=true;btnIn.textContent='已打卡 ✓';btnOut.disabled=!!todayRec.clockOut;btnOut.textContent=todayRec.clockOut?'已打卡 ✓':'下班打卡';}
    else{btnIn.disabled=false;btnIn.textContent='上班打卡';btnOut.disabled=true;btnOut.textContent='下班打卡';}

    const statusEl=document.getElementById('todayStatus');
    if(todayRec){
      let h='<div class="time-display">';
      h+='<div class="time-row"><span class="label">上班</span><span class="value">'+(todayRec.clockIn||'—')+'</span></div>';
      h+='<div class="time-row"><span class="label">下班</span><span class="value">'+(todayRec.clockOut||'—')+'</span></div>';
      if(todayRec.clockIn&&todayRec.clockOut){
        const ot=calcOvertime(todayRec.clockOut,settings);
        h+=ot>0?'<div class="overtime-badge">加班 '+minToH(ot)+'</div>':'<div class="overtime-badge zero">今日无加班</div>';
      }
      h+='</div>';statusEl.innerHTML=h;
    }else{statusEl.innerHTML='<div class="time-display" style="color:var(--text2)">今日暂无打卡记录</div>';}

    const now=new Date(), monthStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    const mR=records.filter(r=>r.date.startsWith(monthStr)&&r.clockIn&&r.clockOut), ms=calcStats(mR,settings);
    document.getElementById('statDays').textContent=ms.days;document.getElementById('statOT').textContent=minToH(ms.totalOT);document.getElementById('statLate').textContent=ms.late;
    document.getElementById('statAvgMonth').textContent=avgLabel(ms.totalOT,ms.days);document.getElementById('statAvgMonthOt').textContent=avgLabel(ms.totalOT,ms.days);document.getElementById('statAvgMonthLate').textContent=ms.late>0?'平均 '+ms.late.toFixed(1)+'次':'—';

    const dow=now.getDay()||7, mon=new Date(now);mon.setDate(now.getDate()-dow+1);
    const monStr=mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
    const wR=records.filter(r=>r.date>=monStr&&r.clockIn&&r.clockOut), ws=calcStats(wR,settings);
    document.getElementById('statWeekDays').textContent=ws.days;document.getElementById('statWeekOT').textContent=minToH(ws.totalOT);document.getElementById('statWeekLate').textContent=ws.late;
    document.getElementById('statAvgWeek').textContent=avgLabel(ws.totalOT,ws.days);document.getElementById('statAvgWeekOt').textContent=avgLabel(ws.totalOT,ws.days);document.getElementById('statAvgWeekLate').textContent=ws.late>0?'本周 '+ws.late+'次':'—';

    const ago=new Date(now);ago.setMonth(now.getMonth()-3);
    const agoStr=ago.getFullYear()+'-'+String(ago.getMonth()+1).padStart(2,'0')+'-'+String(ago.getDate()).padStart(2,'0');
    const tR=records.filter(r=>r.date>=agoStr&&r.clockIn&&r.clockOut), ts=calcStats(tR,settings);
    document.getElementById('stat3mDays').textContent=ts.days;document.getElementById('stat3mOT').textContent=minToH(ts.totalOT);document.getElementById('stat3mLate').textContent=ts.late;
    document.getElementById('statAvg3m').textContent=avgLabel(ts.totalOT,ts.days);document.getElementById('statAvg3mOt').textContent=avgLabel(ts.totalOT,ts.days);document.getElementById('statAvg3mLate').textContent=ts.late>0?'平均 '+ts.late.toFixed(1)+'次/月':'—';

    const list=document.getElementById('recordList');
    if(records.length===0){list.innerHTML='<div class="empty">暂无记录</div>';return;}
    list.innerHTML=records.slice(0,60).map(r=>{
      let right='', info='';
      if(r.clockIn&&r.clockOut){
        const ot=calcOvertime(r.clockOut,settings), lt=isLate(r.clockIn,settings);
        info=(lt?'<span class="late">迟到</span> ':'')+(ot>0?'<span class="ot">加班'+minToH(ot)+'</span>':'');
      }else{info='<span style="color:var(--orange)">未完整</span>';}
      right+='<div class="record-right"><button class="action-btn edit" data-date="'+r.date+'">修改</button><button class="action-btn del" data-date="'+r.date+'">删除</button></div>';
      return '<div class="record-item"><div><div class="record-date">'+r.date+'</div><div class="record-time">'+(r.clockIn||'—')+' ~ '+(r.clockOut||'—')+' '+info+'</div></div>'+right+'</div>';
    }).join('');
  }

  document.getElementById('btnIn').addEventListener('click',clockIn);
  document.getElementById('btnOut').addEventListener('click',clockOut);
  document.getElementById('toggleSettings').addEventListener('click',()=>document.getElementById('settingsPanel').classList.toggle('show'));
  document.getElementById('saveSettingsBtn').addEventListener('click',()=>{
    const s={workStart:document.getElementById('setWorkStart').value,workEnd:document.getElementById('setWorkEnd').value,flexMin:parseInt(document.getElementById('setFlex').value)||0,buffer:parseInt(document.getElementById('setBuffer').value)||0};
    localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));document.getElementById('settingsPanel').classList.remove('show');render();
  });
  document.getElementById('recordList').addEventListener('click',e=>{
    const date=e.target.dataset.date;if(!date)return;
    if(e.target.classList.contains('del'))deleteRecord(date);
    if(e.target.classList.contains('edit'))openEditModal(date);
  });
  document.getElementById('editCancel').addEventListener('click',closeEditModal);
  document.getElementById('editConfirm').addEventListener('click',saveEditTime);
  document.getElementById('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeEditModal();});

  render();
})();
</script>
</body>
</html>
